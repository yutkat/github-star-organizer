manifest-version: "1"
min-version: v0.86.2
name: GitHub Star Organizer
emoji: "⭐"
description: Categorize starred repositories into the token owner's GitHub Lists.

includes:
  - .github/workflows/categorize-stars.md

config:
  - type: repo-secret
    name: COPILOT_GITHUB_TOKEN
    prompt: Paste a fine-grained PAT for Copilot inference only
    description: Grant only Copilot Requests; Copilot CLI ignores classic tokens.
  - type: repo-secret
    name: STAR_LISTS_TOKEN
    prompt: Paste a classic PAT for reading stars and updating Lists
    description: Classic token with the user scope; Lists mutations reject fine-grained PATs.
