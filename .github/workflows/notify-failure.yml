name: Notify categorization failures

on:
  workflow_run:
    workflows:
      - Categorize starred repositories
    types:
      - completed

permissions:
  issues: write

jobs:
  assign:
    name: Assign failure issues
    runs-on: ubuntu-latest
    steps:
      # gh-aw opens failure issues without assignees, so nobody gets notified.
      # Its conclusion job finishes before this event, so the issues already exist.
      - name: Assign open failure issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ vars.FAILURE_ISSUE_ASSIGNEE || github.repository_owner }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          issues=$(gh issue list --state open --label agentic-workflows \
            --json number,assignees \
            --jq '.[] | select(.assignees == []) | .number')
          for issue in $issues; do
            gh issue edit "$issue" --add-assignee "$ASSIGNEE"
          done

          case "$CONCLUSION" in
            success | skipped | cancelled | neutral) exit 0 ;;
          esac
          open_count=$(gh issue list --state open --label agentic-workflows \
            --json number --jq 'length')
          if [ "$open_count" -eq 0 ]; then
            gh issue create \
              --title "[aw] Categorize starred repositories ${CONCLUSION}" \
              --body "Workflow run concluded with \`${CONCLUSION}\`: ${RUN_URL}" \
              --label agentic-workflows \
              --assignee "$ASSIGNEE"
          fi
